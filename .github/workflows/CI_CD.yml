name: Backend + Camunda CI Pipeline

on:
  push:
    branches:
      - prod
      - mvp

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod tidy

      - name: Build services
        run: go build ./...

      - name: Run tests
        continue-on-error: true
        run: |
          PKGS=$(go list ./... \
            | grep -v "/test/e2e" \
            | grep -v "/cmd/tools/registry-updater" \
            | grep -v "/internal/workers/auth/captcha-verify")

          go test $PKGS

      - name: Build Gateway image
        run: |
          docker build -t ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            -f deployments/docker/Dockerfile.gateway \
            .

      - name: Build Worker image
        run: |
          docker build -t ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            -f deployments/docker/Dockerfile.worker \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

          docker tag ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }}

          docker tag ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }}

          docker tag ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:latest

          docker tag ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:latest

          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV

      - name: Push images to ECR
        run: |
          docker push $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }}
          docker push $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }}

          docker push $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:latest
          docker push $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:latest

             #################################################
      # Deploy via AWS Systems Manager
      #################################################
      - name: Deploy via SSM
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          REGION="${{ secrets.AWS_REGION }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          cat > /tmp/ssm-payload.json <<EOF
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["INSTANCE_ID_PLACEHOLDER"],
            "Comment": "Backend deploy branch=BRANCH_PLACEHOLDER sha=${{ github.sha }}",
            "Parameters": {
              "commands": [
                "set -e",
                "cd /home/ubuntu/Workflow-and-Workers/deployments/docker",
                "ACCOUNT_ID=\$(aws sts get-caller-identity --query Account --output text)",
                "ECR_URL=\${ACCOUNT_ID}.dkr.ecr.REGION_PLACEHOLDER.amazonaws.com",
                "aws ecr get-login-password --region REGION_PLACEHOLDER | docker login --username AWS --password-stdin \${ECR_URL}",
                "git config --global --add safe.directory /home/ubuntu/Workflow-and-Workers",
                "git fetch --all",
                "git checkout BRANCH_PLACEHOLDER",
                "git pull origin BRANCH_PLACEHOLDER",
                "docker compose down",
                "docker compose pull",
                "docker compose up -d --remove-orphans",
                "docker system prune -af"
              ]
            }
          }
          EOF

          sed -i "s|INSTANCE_ID_PLACEHOLDER|${INSTANCE_ID}|g" /tmp/ssm-payload.json
          sed -i "s|BRANCH_PLACEHOLDER|${BRANCH}|g" /tmp/ssm-payload.json
          sed -i "s|REGION_PLACEHOLDER|${REGION}|g" /tmp/ssm-payload.json

          COMMAND_ID=$(aws ssm send-command \
            --region "${REGION}" \
            --cli-input-json file:///tmp/ssm-payload.json \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=${COMMAND_ID}" >> $GITHUB_ENV
          echo "SSM Command ID: ${COMMAND_ID}"

      #################################################
      # Wait for Deployment & Print Logs
      #################################################
      - name: Wait for Deployment & Print Logs
        shell: bash
        run: |
          REGION="${{ secrets.AWS_REGION }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          echo "Waiting for deployment..."

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current Status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut)
                break
                ;;
            esac

            sleep 5
          done

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --output json)

          echo ""
          echo "========== STATUS =========="
          echo "$OUTPUT" | jq -r '.Status'

          echo ""
          echo "========== STDOUT =========="
          echo "$OUTPUT" | jq -r '.StandardOutputContent'

          echo ""
          echo "========== STDERR =========="
          echo "$OUTPUT" | jq -r '.StandardErrorContent'

          STATUS=$(echo "$OUTPUT" | jq -r '.Status')

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      sleep 5
    done

    echo ""
    echo "========== STATUS =========="
    echo "$STATUS"

    echo ""
    echo "========== STDOUT =========="
    echo "$OUTPUT" | jq -r '.StandardOutputContent'

    echo ""
    echo "========== STDERR =========="
    echo "$OUTPUT" | jq -r '.StandardErrorContent'

    if [ "$STATUS" != "Success" ]; then
      exit 1
    fi
