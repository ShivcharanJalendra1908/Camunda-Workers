name: Backend + Camunda CI Pipeline

on:
  push:
    branches:
      - prod
      - mvp

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod tidy

      - name: Build services
        run: go build ./...

      - name: Run tests
        continue-on-error: true
        run: |
          PKGS=$(go list ./... \
            | grep -v "/test/e2e" \
            | grep -v "/cmd/tools/registry-updater" \
            | grep -v "/internal/workers/auth/captcha-verify")

          go test $PKGS

      - name: Build Gateway image
        run: |
          docker build -t ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            -f deployments/docker/Dockerfile.gateway \
            .

      - name: Build Worker image
        run: |
          docker build -t ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            -f deployments/docker/Dockerfile.worker \
            .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

          docker tag ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }}

          docker tag ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }}

          docker tag ${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:latest

          docker tag ${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }} \
            $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:latest

          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV

      - name: Push images to ECR
        run: |
          docker push $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:${{ github.sha }}
          docker push $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:${{ github.sha }}

          docker push $ECR_URL/${{ vars.BACKEND_GATEWAY_IMAGE }}:latest
          docker push $ECR_URL/${{ vars.BACKEND_WORKER_IMAGE }}:latest

            #################################################
      # Verify SSM Managed Instance
      #################################################
      - name: Verify SSM Managed Instance
        shell: bash
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          echo "SSM Status: $STATUS"

          if [ "$STATUS" != "Online" ]; then
            echo "ERROR: EC2 is not online in Systems Manager."
            exit 1
          fi

      #################################################
      # Deploy via AWS Systems Manager
      #################################################
      - name: Deploy via SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
           --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
           --document-name "AWS-RunShellScript" \
           --comment "Deploy Backend" \
           --parameters '{
             "commands":[
                "cd /home/ubuntu/Workflow-and-Workers/deployments/docker",
                "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)",
                "ECR_URL=$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com",
                "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_URL",
                "git config --global --add safe.directory /home/ubuntu/Workflow-and-Workers",
                "git fetch --all",
                "git checkout ${{ github.ref_name }}",
                "git pull origin ${{ github.ref_name }}",
                "docker compose down",
                "docker compose pull",
                "docker compose up -d --remove-orphans",
                "docker system prune -af"
              ]
            }' \
           --query "Command.CommandId" \
           --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "Command ID: $COMMAND_ID"

      - name: Get Deployment Logs
        shell: bash
        run: |
         sleep 50

         OUTPUT=$(aws ssm get-command-invocation \
           --command-id "$COMMAND_ID" \
           --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
           --output json)

         echo "========== STATUS =========="
         echo "$OUTPUT" | jq -r '.Status'

         echo ""
         echo "========== STDOUT =========="
         echo "$OUTPUT" | jq -r '.StandardOutputContent'

         echo ""
         echo "========== STDERR =========="
         echo "$OUTPUT" | jq -r '.StandardErrorContent'

         STATUS=$(echo "$OUTPUT" | jq -r '.Status')

         if [ "$STATUS" != "Success" ]; then
           exit 1
         fi
