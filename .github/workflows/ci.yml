name: Backend + Camunda CI Pipeline

on:
  push:
    branches:
      - backend-ci-test
      - mvp
  pull_request:
    branches:
      - mvp
      
permissions:
 contents: read
 id-token: write
 actions: read     

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod tidy

      - name: Build services
        run: go build ./...

      - name: Run tests (skip problematic packages)
        run: |
          PKGS=$(go list ./... \
            | grep -v "/test/e2e" \
            | grep -v "/cmd/tools/registry-updater" \
            | grep -v "/internal/workers/auth/captcha-verify")

          go test $PKGS

      - name: Build Gateway image
        run: |
          docker build -t backend-gateway:${{ github.sha }} \
            -f deployments/docker/Dockerfile.gateway \
            .

      - name: Build Worker image
        run: |
          docker build -t backend-worker:${{ github.sha }} \
            -f deployments/docker/Dockerfile.worker \
            .


      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for ECR
        if: github.event_name == 'push'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

          docker tag backend-gateway:${{ github.sha }} $ECR_URL/backend-gateway:${{ github.sha }}
          docker tag backend-worker:${{ github.sha }} $ECR_URL/backend-worker:${{ github.sha }}

          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV

      - name: Push images to ECR
        if: github.event_name == 'push'
        run: |
          docker push $ECR_URL/backend-gateway:${{ github.sha }}
          docker push $ECR_URL/backend-worker:${{ github.sha }}


      - name: Start Camunda stack
        run: |
          cd deployments/docker
          docker compose up -d || true
          sleep 15
          docker compose ps

      - name: Verify containers
        run: docker ps -a

