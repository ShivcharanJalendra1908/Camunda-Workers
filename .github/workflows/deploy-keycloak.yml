name: Deploy Keycloak Theme

on:
  push:
    branches:
      - mvp
      - prod
    paths:
      - 'keycloak-theme/**'
      - '.github/workflows/deploy-keycloak.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect Environment
        id: env-detector
        shell: bash
        run: |
          set -euo pipefail
 
          REF="${{ github.ref }}"
 
          if [[ "$REF" == "refs/heads/mvp" ]]; then
            echo "env_name=dev"           >> $GITHUB_OUTPUT
            echo "vault_role=backend-dev" >> $GITHUB_OUTPUT
 
          elif [[ "$REF" == "refs/heads/prod" ]]; then
            echo "env_name=prod"           >> $GITHUB_OUTPUT
            echo "vault_role=backend-prod" >> $GITHUB_OUTPUT
 
          else
            echo "::error::Unsupported branch. Only mvp and prod are supported."
            exit 1
          fi
 
     
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: ${{ steps.env-detector.outputs.vault_role }}
          jwtGithubAudience: ${{ vars.VAULT_ADDR }}
 
          secrets: |
            kv/data/${{ steps.env-detector.outputs.env_name }}/backend/config AWS_REGION             | AWS_REGION ;
            kv/data/${{ steps.env-detector.outputs.env_name }}/backend/config AWS_ROLE_ARN            | AWS_ROLE_ARN ;
            kv/data/${{ steps.env-detector.outputs.env_name }}/backend/config INSTANCE_ID             | INSTANCE_ID ;

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dispatch SSM deploy command
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          REGION="${{ env.AWS_REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          # Write deploy script to a clean JSON file
          cat > /tmp/ssm-payload.json << ENDJSON
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["${INSTANCE_ID}"],
            "Comment": "Keycloak deploy branch=${BRANCH} sha=${{ github.sha }}",
            "Parameters": {
              "commands": [
                      "set -e",
                      "cd /home/ubuntu/Workflow-and-Workers/deployments/docker",
                      "export HOME=/root",
                      "git config --global --add safe.directory /home/ubuntu/Workflow-and-Workers",
                      "sudo -u ubuntu git -C /home/ubuntu/Workflow-and-Workers fetch origin",
                      "sudo -u ubuntu git -C /home/ubuntu/Workflow-and-Workers checkout BRANCH_PLACEHOLDER",
                      "sudo -u ubuntu git -C /home/ubuntu/Workflow-and-Workers reset --hard origin/BRANCH_PLACEHOLDER",
                      "sudo docker compose stop keycloak",
                      "sudo docker compose up -d --force-recreate keycloak"
              ]
            }
          }
          ENDJSON
          # Substitute placeholders with actual values
          sed -i "s|REGION_PLACEHOLDER|${REGION}|g" /tmp/ssm-payload.json
          sed -i "s|BRANCH_PLACEHOLDER|${BRANCH}|g" /tmp/ssm-payload.json
          # Dispatch the SSM command
          SSM_COMMAND_ID=$(aws ssm send-command \
            --region "${REGION}" \
            --cli-input-json file:///tmp/ssm-payload.json \
            --output text \
            --query "Command.CommandId")
          echo "SSM_COMMAND_ID=${SSM_COMMAND_ID}" >> $GITHUB_ENV
          echo "Dispatched SSM command: ${SSM_COMMAND_ID}"
          
      - name: Wait for SSM deploy to complete
        shell: bash
        run: |
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          echo "Waiting for SSM command [${SSM_COMMAND_ID}] on instance [${INSTANCE_ID}] ..."
          echo ""
          # Poll every 10 seconds, max 6 minutes (36 attempts)
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${SSM_COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --region "${REGION}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "  [${i}/36] Status: ${STATUS}"
            if [[ "${STATUS}" == "Success" ]]; then
              echo ""
              echo "✅ Deployment succeeded!"
              echo "════════ Remote Output ════════"
              aws ssm get-command-invocation \
                --command-id "${SSM_COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --region "${REGION}" \
                --query "StandardOutputContent" \
                --output text
              echo "═══════════════════════════════"
              exit 0
            elif [[ "${STATUS}" == "Failed" \
                 || "${STATUS}" == "TimedOut" \
                 || "${STATUS}" == "Cancelled" \
                 || "${STATUS}" == "DeliveryTimedOut" ]]; then
              echo ""
              echo "❌ Deployment FAILED — Status: ${STATUS}"
              echo "════════ Remote Error ════════"
              aws ssm get-command-invocation \
                --command-id "${SSM_COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --region "${REGION}" \
                --query "StandardErrorContent" \
                --output text
              echo "══════════════════════════════"
              exit 1
            fi
            sleep 10
          done
          echo "❌ Timed out after 6 minutes. SSM command did not complete."
          exit 1
