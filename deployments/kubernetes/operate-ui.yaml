# deployments/kubernetes/operate-ui.yaml
# Add this to your existing Kubernetes setup
# Same pattern as your existing deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operate-ui
  namespace: camunda-workers   # same as your existing namespace.yaml
  labels:
    app: operate-ui
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operate-ui
  template:
    metadata:
      labels:
        app: operate-ui
    spec:
      containers:
        - name: operate-ui
          image: 177925987307.dkr.ecr.us-east-1.amazonaws.com/operate-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ecr-secret   # same secret your other deployments use

---
apiVersion: v1
kind: Service
metadata:
  name: operate-ui
  namespace: camunda-workers
spec:
  selector:
    app: operate-ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# Optional: Ingress if you want a subdomain like operate.lemici.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operate-ui-ingress
  namespace: camunda-workers
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: operate.lemici.com   # ← change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: operate-ui
                port:
                  number: 80
  tls:
    - hosts:
        - operate.lemici.com
      secretName: operate-ui-tls
      