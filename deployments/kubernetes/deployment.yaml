apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda-workers
  namespace: camunda-workers
  labels:
    app: camunda-workers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: camunda-workers
  template:
    metadata:
      labels:
        app: camunda-workers
    spec:
      containers:
      - name: worker
        image: your-registry/camunda-workers:latest
        ports:
        - containerPort: 8080
          name: health
        - containerPort: 9090
          name: metrics
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: CAMUNDA_BROKER_ADDRESS
          value: "zeebe:26500"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: password
        - name: WEB_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: web_search_api_key
        - name: WEB_SEARCH_ENGINE_ID
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: web_search_engine_id
        envFrom:
        - configMapRef:
            name: worker-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

  apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-worker
  namespace: camunda
  labels:
    app: template-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: template-worker
  template:
    metadata:
      labels:
        app: template-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: worker
        image: your-registry/template-worker:latest
        imagePullPolicy: Always
        
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: ZEEBE_ADDRESS
          value: "zeebe-gateway:26500"
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TASK_TYPE
          value: "template-processor"
        - name: MAX_JOBS_ACTIVE
          value: "10"
        - name: TIMEOUT
          value: "30"
        - name: TEMPLATES_BASE_DIR
          value: "/app/templates"
        - name: ENABLE_CACHE
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_METRICS
          value: "true"
        
        # Security limits
        - name: MAX_TEMPLATE_SIZE
          value: "10485760"
        - name: MAX_INPUT_SIZE
          value: "10485760"
        - name: MAX_NESTING_DEPTH
          value: "20"
        
        volumeMounts:
        - name: templates
          mountPath: /app/templates
          readOnly: true
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: templates
        configMap:
          name: template-configs
      
      terminationGracePeriodSeconds: 30