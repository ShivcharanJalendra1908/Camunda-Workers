version: '3.8'

networks:
  camunda-network:
    driver: bridge

volumes:
  zeebe-data:
  postgres-data:
  es-data:
  redis-data:
  keycloak-data:
  ollama-data:

services:

# ============================================================================
# CAMUNDA 8
# ============================================================================

  zeebe:
    image: camunda/zeebe:8.3.9
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
      - "26501:26501"
    environment:
      ZEEBE_BROKER_GATEWAY_ENABLE: "true"
      ZEEBE_BROKER_NETWORK_HOST: 0.0.0.0
      ZEEBE_BROKER_GATEWAY_NETWORK_HOST: 0.0.0.0
      ZEEBE_GATEWAY_SECURITY_AUTHENTICATION_MODE: none
      ZEEBE_BROKER_GATEWAY_SECURITY_ENABLED: "false"
      ZEEBE_BROKER_CLUSTER_CLUSTERNAME: camunda-cluster
      ZEEBE_BROKER_CLUSTER_NODEID: 0
      ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT: 1
      ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR: 1
      ZEEBE_BROKER_CLUSTER_CLUSTERSIZE: 1
      ZEEBE_BROKER_NETWORK_COMMANDAPI_PORT: 26501
      ZEEBE_BROKER_NETWORK_INTERNALAPI_PORT: 26502
      ZEEBE_BROKER_GATEWAY_NETWORK_PORT: 26500
      ZEEBE_BROKER_THREADS_CPUTHREADCOUNT: 4
      ZEEBE_BROKER_THREADS_IOTHREADCOUNT: 4
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: 1
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_DELAY: 1
      ZEEBE_LOG_LEVEL: info
      JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - zeebe-data:/usr/local/zeebe/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - camunda-network
    restart: on-failure:5

# ============================================================================
# INFRASTRUCTURE
# ============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "franchises,keycloak,camunda"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - camunda-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - camunda-network

# ============================================================================
# OBSERVABILITY
# ============================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - camunda-network

# ============================================================================
# KEYCLOAK
# ============================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camunda-network

# ============================================================================
# OLLAMA
# ============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - camunda-network
    restart: unless-stopped

# ============================================================================
# APPLICATION
# ============================================================================

  api-gateway:
    image: 177925987307.dkr.ecr.ap-south-1.amazonaws.com/backend-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      ZEEBE_ADDRESS: zeebe:26500
      POSTGRES_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      zeebe:
        condition: service_healthy
    networks:
      - camunda-network

  camunda-workers:
    image: 177925987307.dkr.ecr.ap-south-1.amazonaws.com/backend-worker:latest
    container_name: camunda-workers
    environment:
      ZEEBE_ADDRESS: zeebe:26500
      POSTGRES_HOST: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      OLLAMA_URL: http://ollama:11434
      LLM_ENDPOINT: http://ollama:11434
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      LOG_LEVEL: info
    depends_on:
      ollama:
        condition: service_started
      zeebe:
        condition: service_healthy
    networks:
      - camunda-network
    restart: on-failure:3
