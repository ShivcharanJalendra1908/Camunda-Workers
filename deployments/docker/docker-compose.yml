version: '3.8'

networks:
  camunda-network:
    driver: bridge

volumes:
  zeebe-data:
  postgres-data:
  es-data:
  redis-data:
  keycloak-data:

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../deployments/docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ingest.geoip.downloader.enabled: "false"
      cluster.name: camunda-cluster
      network.host: 0.0.0.0
      http.port: 9200
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  template-worker:
    build: .
    depends_on:
      - zeebe
    environment:
      # Zeebe connection
      - ZEEBE_ADDRESS=zeebe:26500
      - ZEEBE_INSECURE=true
      
      # Worker configuration
      - WORKER_ID=template-worker-1
      - TASK_TYPE=template-processor
      - MAX_JOBS_ACTIVE=10
      - TIMEOUT=30
      
      # Security limits
      - MAX_TEMPLATE_SIZE=10485760
      - MAX_INPUT_SIZE=10485760
      - MAX_NESTING_DEPTH=20
      - MAX_MAPPINGS=1000
      - MAX_EXPRESSION_LENGTH=1000
      - MAX_REGEX_PATTERN_LENGTH=500
      
      # Templates
      - TEMPLATES_BASE_DIR=/app/templates
      - ENABLE_CACHE=true
      - MAX_CACHE_SIZE=100
      
      # Logging & Monitoring
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
    volumes:
      - ./templates:/app/templates:ro
    ports:
      - "8081:8080"  # Health checks
      - "9091:9090"  # Metrics
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # KEYCLOAK
  # ============================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ../../deployments/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: on-failure:5

  # ============================================================================
  # CAMUNDA 8
  # ============================================================================

  zeebe:
    image: camunda/zeebe:8.3.9
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      ZEEBE_BROKER_GATEWAY_ENABLE: "true"
      ZEEBE_BROKER_NETWORK_HOST: 0.0.0.0
      ZEEBE_BROKER_GATEWAY_NETWORK_HOST: 0.0.0.0
      ZEEBE_GATEWAY_SECURITY_AUTHENTICATION_MODE: none
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_LOG_LEVEL: warn
      JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - zeebe-data:/usr/local/zeebe/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure:3

  operate:
    image: camunda/operate:8.3.9
    container_name: operate
    ports:
      - "8081:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - camunda-network
    restart: on-failure:3

  # ============================================================================
  # APPLICATION
  # ============================================================================

  api-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.gateway
    image: camunda-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_NAME: api-gateway
      APP_ENVIRONMENT: development
      API_PORT: 8080

      ZEEBE_ADDRESS: zeebe:26500

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable

      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379

      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: camunda-platform
      KEYCLOAK_CLIENT_ID: worker-client
      KEYCLOAK_CLIENT_SECRET: worker-secret

      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      zeebe:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure:3

  camunda-workers:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    image: camunda-workers:latest
    container_name: camunda-workers
    environment:
      APP_NAME: camunda-workers
      APP_ENVIRONMENT: development

      ZEEBE_ADDRESS: zeebe:26500
      ZEEBE_CLIENT_MODE: plain

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: franchises
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable

      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      zeebe:
        condition: service_healthy
    volumes:
      - ../../configs:/app/configs:ro
      - ../../bpmn:/app/bpmn:ro
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: on-failure:3
  

  
