version: '3.8'

networks:
  camunda-network:
    driver: bridge

volumes:
  zeebe-data:
  postgres-data:
  es-data:
  redis-data:
  keycloak-data:

services:

# ============================================================================
# CAMUNDA 8 - MOVED TO TOP FOR PRIORITY
# ============================================================================

  zeebe:
    image: camunda/zeebe:8.3.9
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
      - "26501:26501"
    environment:
      ZEEBE_BROKER_GATEWAY_ENABLE: "true"
      ZEEBE_BROKER_NETWORK_HOST: 0.0.0.0
      ZEEBE_BROKER_GATEWAY_NETWORK_HOST: 0.0.0.0
      ZEEBE_GATEWAY_SECURITY_AUTHENTICATION_MODE: none
      ZEEBE_BROKER_GATEWAY_SECURITY_ENABLED: "false"
      ZEEBE_BROKER_CLUSTER_CLUSTERNAME: camunda-cluster
      ZEEBE_BROKER_CLUSTER_NODEID: 0
      ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT: 1
      ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR: 1
      ZEEBE_BROKER_CLUSTER_CLUSTERSIZE: 1
      ZEEBE_BROKER_NETWORK_COMMANDAPI_PORT: 26501
      ZEEBE_BROKER_NETWORK_INTERNALAPI_PORT: 26502
      ZEEBE_BROKER_GATEWAY_NETWORK_PORT: 26500
      ZEEBE_BROKER_THREADS_CPUTHREADCOUNT: 4
      ZEEBE_BROKER_THREADS_IOTHREADCOUNT: 4
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: 1
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_DELAY: 1
      ZEEBE_LOG_LEVEL: info
      JAVA_OPTS: "-Xms1g -Xmx1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/local/zeebe/data/heapdump.hprof"
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: 0.85
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: 0.87
    volumes:
      - zeebe-data:/usr/local/zeebe/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: on-failure:5


# ============================================================================
# INFRASTRUCTURE
# ============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "franchises,keycloak,camunda"
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./postgres/auth-schema.sql:/docker-entrypoint-initdb.d/auth-schema.sql:ro
      - ./postgres/load-csv-data.sql:/docker-entrypoint-initdb.d/load-csv-data.sql:ro
      - ../../data/postgres:/csv-data:ro
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 60s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      ingest.geoip.downloader.enabled: "false"
      cluster.name: camunda-cluster
      network.host: 0.0.0.0
      http.port: 9200
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

# ============================================================================
# OBSERVABILITY
# ============================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "6831:6831/udp"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      LOG_LEVEL: info
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  operate:
    image: camunda/operate:8.3.9
    container_name: operate
    ports:
      - "8082:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: dev

      CAMUNDA_OPERATE_IMPORTER_STARTLOADINGDATAFROMSCRATCH: false
      CAMUNDA_OPERATE_IMPORTER_READERBACKOFF: 100
      CAMUNDA_OPERATE_IMPORTER_QUEUESIZE: 1000
      CAMUNDA_OPERATE_ELASTICSEARCH_REQUESTTIMEOUT: 10000
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - camunda-network
    restart: on-failure:3

# ============================================================================
# KEYCLOAK
# ============================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: on-failure:5

# ============================================================================
# APPLICATION
# ============================================================================

  api-gateway:
    image: 177925987307.dkr.ecr.ap-south-1.amazonaws.com/backend-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_NAME: api-gateway
      APP_ENVIRONMENT: development
      API_PORT: 8080
      ZEEBE_ADDRESS: zeebe:26500
      ZEEBE_CLIENT_REQUEST_TIMEOUT: 45s
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: camunda-platform
      KEYCLOAK_CLIENT_ID: worker-client
      KEYCLOAK_CLIENT_SECRET: worker-secret
      LOG_LEVEL: debug
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OTEL_SERVICE_NAME: api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      zeebe:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure:3

  camunda-workers:
    image: 177925987307.dkr.ecr.ap-south-1.amazonaws.com/backend-worker:latest
    container_name: camunda-workers
    environment:
      APP_NAME: camunda-workers
      APP_ENVIRONMENT: development
      ZEEBE_ADDRESS: zeebe:26500
      ZEEBE_CLIENT_MODE: plain
      ZEEBE_CLIENT_REQUEST_TIMEOUT: 45s
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: franchises
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: franchises
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDRESS: redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: camunda-platform
      KEYCLOAK_CLIENT_ID: worker-client
      KEYCLOAK_CLIENT_SECRET: worker-secret
      OLLAMA_URL: http://172.31.47.136:11434
      LLM_ENDPOINT: http://172.31.47.136:11434
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OTEL_EXPORTER_JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      OTEL_SERVICE_NAME: camunda-workers
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      zeebe:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    volumes:
      - ../../configs:/app/configs:ro
      - ../../bpmn:/app/bpmn:ro
    networks:
      - camunda-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep worker-manager || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: on-failure:3
