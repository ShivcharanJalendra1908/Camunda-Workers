# configs/config.dev.yaml
app:
  environment: development

camunda:
  oauth:
    enabled: true
    client_id: "worker-client" 
    client_secret: "worker-secret"
    token_url: "https://us-dev-api.lemici.com/realms/camunda-platform/protocol/openid-connect/token"
    audience: "zeebe-api"

auth:
  # keycloak:
  #   issuer: "http://localhost:8081/realms/auth-service"
  #   clientId: "frontend-app"
  #   redirectUrl: "http://localhost:3000/callback"
  #   publicBaseUrl: "http://localhost:8081"
  #   post_logout_redirect_uri: "http://localhost:3000/login" 
  keycloak:
    url: "https://us-dev-api.lemici.com"
    realm: "camunda-platform"
    issuer: "https://us-dev-api.lemici.com/realms/camunda-platform"
    clientId: "lemici-frontend"
    # redirectUrl: "http://localhost:3000/callback"
    redirectUrl: "https://d595hydlunw5u.cloudfront.net/callback"
    publicBaseUrl: "https://us-dev-api.lemici.com"   # env variable se aayega
    # post_logout_redirect_uri: "http://localhost:3000/login"
    post_logout_redirect_uri: "https://d595hydlunw5u.cloudfront.net/login"
    
  session:
    secure: false  # Allow HTTP in dev
    sameSite: "Lax"

logging:
  level: debug
  format: console

database:
  postgres:
    host: postgres
    port: 5432
    database: franchises
    user: postgres
    password: postgres
    max_connections: 20
    max_idle: 5
  elasticsearch:
    addresses: ["http://elasticsearch:9200"]
    username: ""
    password: ""
  redis:
    address: redis:6379

apis:
  genai:
    base_url: "http://localhost:8080"
  web_search:
    api_key: "dev-api-key"
    engine_id: "dev-engine-id"

smtp:
  host: "localhost"        # For development with MailHog
  port: 1025               # MailHog default port
  username: "test"         # Not needed for MailHog
  password: "test"         # Not needed for MailHog
  from: "noreply@franchisehub.dev"
  use_tls: false           # Disable TLS for local development
