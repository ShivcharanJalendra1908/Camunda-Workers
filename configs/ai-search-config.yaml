ai_search_worker:
  worker_id: "ai-search-worker"
  task_type: "ai-search"
  max_jobs: 100
  poll_interval: "25ms"
  request_timeout: "30s"

# llm:
#   provider: "ollama"
#   model: "llama3.2"
#   endpoint: "http://ollama:11434"
#   timeout: "15s"
#   max_tokens: 1000
#   temperature: 0.1
llm:
  provider: "ollama"
  model: "tinyllama"  # ✅ CHANGED from llama3.2
  endpoint: "http://ollama:11434"
  timeout: "45s"  # ✅ Increased from 15s
  max_tokens: 1000
  temperature: 0.1

elasticsearch:
  endpoints:
    - "http://localhost:9200"
  index_name: "franchises"
  search_timeout: "5s"
  default_page_size: 20

validation:
  max_query_length: 500
  min_query_length: 3

features:
  enable_caching: true
  enable_metrics: true