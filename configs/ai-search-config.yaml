ai_search_worker:
  worker_id: "ai-search-worker"
  task_type: "ai-search"
  max_jobs: 100
  poll_interval: "25ms"
  request_timeout: "5s"      # ✅ CHANGED: 5s (down from 30s)

llm:
  provider: "ollama"
  model: "qwen2.5:0.5b"     # ✅ CHANGED: Qwen 2.5 instead of tinyllama
  endpoint: "http://ollama:11434"
  timeout: "15s"              
  max_tokens: 200            
  temperature: 0.0          

elasticsearch:
  endpoints:
    - "http://localhost:9200"
  index_name: "franchise_listings"  
  search_timeout: "5s"              # ✅ CHANGED: 2s (down from 5s) - faster ES query
  default_page_size: 20

validation:
  max_query_length: 500
  min_query_length: 1        # ✅ CHANGED: Allow single char (from 3)

features:
  enable_caching: true
  enable_metrics: true


