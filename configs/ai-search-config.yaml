ai_search_worker:
  worker_id: "ai-search-worker"
  task_type: "ai-search"
  max_jobs: 100
  poll_interval: "25ms"
  request_timeout: "40s"      # ✅ CHANGE: 5s se 30s (zyada time do)

llm:
  provider: "ollama"
  model: "qwen-franchise-extractor"
  endpoint: "http://ollama:11434"
  timeout: "35s"              
  max_tokens: 300              
  temperature: 0.0          

elasticsearch:
  endpoints:
    - "http://localhost:9200"
  index_name: "franchise_listings"  
  search_timeout: "3s"        # ✅ CHANGE: 5s se 3s (basic search ke liye kaafi hai)
  default_page_size: 20

validation:
  max_query_length: 500
  min_query_length: 1

features:
  enable_caching: true
  enable_metrics: true

  
