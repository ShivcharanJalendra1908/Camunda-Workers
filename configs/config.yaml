# LOGGING CONFIGURATION
# ============================================================================
  logging:
    level: "debug"
    format: "console"
    output: "stdout"

# ============================================================================
# TEMPLATE CONFIGURATION
# ============================================================================
template:
  template_rules:
    route:
      /franchises/detail:free: franchise-detail-basic
      /franchises/detail:premium: franchise-detail-premium
      /franchises/explore:free: franchise-list-limited
      /franchises/explore:premium: franchise-list-full
      /franchises/detail:fallback: franchise-detail-basic
      /franchises/explore:fallback: franchise-list-limited
    flow:
      signup: welcome-email
      signin: sign-in-confirmation
  registry_path: "configs/templates"



# ============================================================================
# VALIDATION CONFIGURATION
# ============================================================================
validation:
  max_string_length: 1000
  max_array_size: 100
  max_request_size_mb: 10
  allowed_sql_identifiers:
    - franchises
    - users
    - applications
  allowed_es_operations:
    - match
    - range
    - term

# ============================================================================
# IDEMPOTENCY CONFIGURATION
# ============================================================================
idempotency:
  enabled: true
  default_ttl: 24h  # 24 hours
  cleanup_interval: 1h  # Run cleanup every hour
  
  # Per-operation TTLs
  ttls:
    api_request: 24h
    email_notification: 24h
    application_creation: 24h
    user_signup: 1h
    user_signin: 15m
    crm_contact: 168h  # 7 days

# ============================================================================
# ERROR HANDLING CONFIGURATION (GAP #4)
# ============================================================================
error_handling:
  # Error logging
  logging:
    include_stack_trace: true
    sanitize_sensitive_data: true
    max_error_message_length: 1000
  
  # Retry configuration by error category
  retry:
    transient:
      max_retries: 3
      backoff_type: "exponential"  # exponential or fixed
      initial_delay: "1s"
      max_delay: "30s"
      multiplier: 2.0
    
    dependency:
      max_retries: 2
      backoff_type: "fixed"
      initial_delay: "5s"
      max_delay: "10s"
    
    validation:
      max_retries: 0  # Never retry validation errors
    
    client:
      max_retries: 0  # Never retry client errors
    
    permanent:
      max_retries: 0  # Never retry permanent errors
  
  # Circuit breaker settings
  circuit_breaker:
    failure_threshold: 5        # Open after 5 failures
    success_threshold: 2        # Close after 2 successes in half-open
    timeout: "60s"              # Stay open for 60 seconds
    half_open_max_requests: 3   # Allow 3 requests in half-open state
  
  # Error alerting thresholds
  alerting:
    critical:
      enabled: true
      error_rate_threshold: 0.10  # 10% error rate
      window: "5m"
      notify: ["pagerduty", "slack"]
    
    high:
      enabled: true
      error_rate_threshold: 0.05  # 5% error rate
      window: "15m"
      notify: ["slack", "email"]
    
    medium:
      enabled: true
      error_rate_threshold: 0.02  # 2% error rate
      window: "1h"
      notify: ["email"]
  
  # Error message templates
  user_messages:
    default: "An unexpected error occurred. Please try again or contact support."
    rate_limit: "You've made too many requests. Please wait {retry_after} seconds."
    service_unavailable: "Our service is temporarily unavailable. Please try again in a few moments."
    validation: "Please check your input: {details}"
    authentication: "Authentication failed. Please sign in again."
  
  # Documentation URLs
  documentation:
    base_url: "https://docs.lemici.com/errors"
    enabled: true

# ============================================================================
# PAGINATION CONFIGURATION  
# ============================================================================
pagination:
  default_page_size: 9    # ← yahan 9 likho → poora system 9 cards dikhayega
  max_page_size: 90
