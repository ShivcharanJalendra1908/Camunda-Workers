    client_id: "lemici-frontend"
    client_secret: "client-secret"
    admin_client_id: "worker-client"                     
    admin_client_secret: "yNHfb6FR4ZGIsUyi27pSpfsAbxEfquhS"
    publicBaseUrl: "https://dev-api.lemici.com"   # ⚠️ CHANGE THIS WHEN DOMAIN IP CHANGES
    redirectUrl: "https://www.lemici.com/callback"  # ⚠️ CHANGE THIS WHEN DOMAIN  CHANGES
