  postgres:
    host: "postgres"
    port: 5432
    database: "franchises"
    user: "postgres"
    password: "postgres"
    max_connections: 20
    max_idle: 5
    sslmode: "disable"
  
  # Elasticsearch
  elasticsearch:
    addresses: 
      - "http://elasticsearch:9200"
    username: "elastic"
    password: "elastic"
    ssl_enabled: false
    indices:
      all: "franchises_all"
    timeout: "30s"
    sniff: false
  
  # Redis
  redis:
    address: "redis:6379"
    password: ""
    db: 0

