# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
app:
  name: camunda-workers
  version: 1.0.0
  environment: development

# ============================================================================
# API GATEWAY CONFIGURATION
# ============================================================================
api:
  port: 8080
  readTimeout: 60
  writeTimeout: 60
  idleTimeout: 120
  
  rateLimit:
    enabled: true
    requestsPerSecond: 100
    burst: 200
  
  cors:
    allowOrigins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://d3c34598mt7qdx.cloudfront.net"
      - "https://www.lemici.com"
      - "https://lemici.com"
      - "https://d595hydlunw5u.cloudfront.net"
      - "https://d3r20osyd7sq76.cloudfront.net"
    allowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowHeaders:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
      - "X-Request-ID"
      - "X-Session-ID"
    exposeHeaders:
      - "X-Request-ID"
      - "X-RateLimit-Limit"
      - "X-RateLimit-Remaining"
    allowCredentials: true
    maxAge: 86400

# ============================================================================
# AUTHENTICATION & AUTHORIZATION
# ============================================================================
