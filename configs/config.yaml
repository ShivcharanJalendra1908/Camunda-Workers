# ============================================================================
# FRANCHISE SEARCH CONFIGURATION
# ============================================================================
franchise_search:
  default_limit: 10
  max_limit: 100
  fuzziness: "AUTO"
  min_score: 0.5
  enable_suggestions: true
  enable_aggregations: true
  enable_spell_check: true
  default_sort: "relevance"
  cache_ttl: 300

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
security:
  # reCAPTCHA
  recaptcha:
    secret_key: "mock_recaptcha_secret_key_dev_6LcAbcDeFgHiJkLmNoPqRsTuVwXyZ"
    verify_url: "https://www.google.com/recaptcha/api/siteverify"
  
  # TLS/SSL
  tls:
    enabled: false
    certFile: ""
    keyFile: ""
  
  # Request Validation
  requestValidation:
    maxBodySize: 5242880
    maxHeaderSize: 1048576
  
  # IP Whitelist
  ipWhitelist:
    enabled: false
    allowedIPs:
      - "127.0.0.1"
      - "::1"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================
monitoring:
  # Metrics (Prometheus)
  metrics:
    enabled: true
    path: "/metrics"
    port: 9090
  
  # Distributed Tracing (Jaeger)
  # tracing:
  #   enabled: false
  #   serviceName: "lemici-api-gateway"
  #   endpoint: "http://localhost:14268/api/traces"
  tracing:
    enabled: true                                  
    serviceName: "lemici-worker-manager"            
    endpoint: "http://jaeger:14268/api/traces"     
    sampler: "always"                                
    probability: 1.0                                
    environment: "development"                      
    version: "1.0.0"                                
    exportTimeout: 30                               

  # Health Checks
  healthCheck:
    enabled: true
    path: "/health"
    interval: 30

# ============================================================================
# WORKFLOW CONFIGURATION
# ============================================================================
workflows:
  defaultTimeout: 300
  maxRetries: 3
  retryBackoff: 2
  
  contextStorage:
    enabled: true
    backend: "redis"
    ttl: 3600

