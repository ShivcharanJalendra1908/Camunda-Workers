# ============================================================================
# CAMUNDA/ZEEBE CONFIGURATION
# ============================================================================
camunda:
  broker_address: "zeebe:26500"
  gateway_address: "zeebe:26500"
  max_jobs_active: 10
  timeout: 30000
  request_timeout: 30000
  use_plaintext_auth: true
  keep_alive: 45
  insecure_skip_verify: false
  ca_cert_path: ""
  
  # Worker Configuration
  worker:
    max_jobs_active: 10
    concurrency: 5
    poll_interval: "50ms"
    timeout: "60s"
  
  # OAuth Configuration for Zeebe
  oauth:
    enabled: false
    client_id: "worker-client"
    client_secret: "worker-secret"
    token_url: "http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token"
    audience: "zeebe-api"

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
